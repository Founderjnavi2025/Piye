
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIYE — Masuk</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="section active" id="section-login">
  <div class="login-box">
    <h1>PIYE</h1>
    <p class="subtitle">Masuk untuk mulai menggunakan PIYE</p>
    <input type="email" id="login-email" placeholder="Email" autocomplete="email" inputmode="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button id="btn-login" class="primary">Masuk</button>
    <button id="btn-register" class="secondary">Daftar Akun Baru</button>
    <p id="login-message" class="message"></p>
  </div>
</div>

<script src="supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
